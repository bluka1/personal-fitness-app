<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Obroci</title>
<meta name="theme-color" content="#17120F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Obroci">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
@font-face{font-family:'Bricolage';src:local('Bricolage Grotesque');}
:root{--bg:#17120F;--sf:#221A16;--sf2:#2C221C;--ln:#3A2D25;--ink:#F3EBE3;
--mut:#A5907F;--amber:#E8A33D;--sage:#86A67C;--water:#4E9BB0;--coral:#D9705A;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{font-family:'Bricolage Grotesque',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
-webkit-font-smoothing:antialiased;min-height:100vh;overscroll-behavior-y:none;}
#app{max-width:460px;margin:0 auto;padding-bottom:calc(78px + env(safe-area-inset-bottom));}
.pad{padding:calc(18px + env(safe-area-inset-top)) 16px 8px;}
h1{font-size:22px;margin:0;letter-spacing:-0.02em;}
h2{font-size:17px;margin:0;letter-spacing:-0.02em;}
.dsp{letter-spacing:-0.02em;}
.num{font-variant-numeric:tabular-nums;}
.mut{color:var(--mut);}
.sub{font-size:13px;color:var(--mut);margin-top:2px;}
.sub2{font-size:11.5px;color:var(--mut);margin-top:4px;}
.note{font-size:12.5px;color:var(--mut);line-height:1.55;margin:0 0 12px;}
.err{color:var(--coral);font-size:13px;margin-top:8px;}
.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600;}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;}
.row{display:flex;align-items:center;gap:10px;}
.row.spread{justify-content:space-between;}
.row.wrap{flex-wrap:wrap;}
.center{text-align:center;}
.grow{flex:1;}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;}
.divider{height:1px;background:var(--ln);margin:16px 0 14px;}
.mb6{margin-bottom:6px;}.mb8{margin-bottom:8px;}.mb10{margin-bottom:10px;}
.mb12{margin-bottom:12px;}.mb14{margin-bottom:14px;}.mb16{margin-bottom:16px;}.mb18{margin-bottom:18px;}
.p12{padding:12px;}.p14{padding:14px;}.p16{padding:16px;}.p18{padding:18px;}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;font-size:15px;}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
input,select,textarea{font-family:inherit;background:var(--sf2);border:1px solid var(--ln);color:var(--ink);
border-radius:10px;padding:10px 12px;font-size:16px;width:100%;display:block;}
textarea{resize:vertical;line-height:1.5;}
input.mini{padding:9px 6px;text-align:center;}
input::placeholder,textarea::placeholder{color:#6F5B4C;}
.btn{background:var(--sf2);border:1px solid var(--ln);border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;}
.btn-p{background:var(--amber);color:#1A1208;border:none;}
.btn-g{border:1px solid var(--ln);color:var(--mut);background:none;}
.btn.sm{padding:6px 13px;font-size:13px;}
.btn.sq{padding:6px 14px;}
.btn.wide{width:100%;}
.btn[disabled]{opacity:.35;}
.row-btn{display:block;width:100%;text-align:left;}
.vessel{width:74px;height:92px;position:relative;flex:none;border:2px solid var(--ln);border-top:none;
border-radius:6px 6px 26px 26px;overflow:hidden;background:var(--sf2);}
.vessel .fill{position:absolute;left:0;right:0;bottom:0;transition:height .45s cubic-bezier(.2,.8,.2,1);}
.bar{height:5px;background:var(--sf2);border-radius:3px;overflow:hidden;}
.bar>div{height:100%;border-radius:3px;transition:width .4s ease;}
.glass{width:26px;height:34px;border-radius:3px 3px 9px 9px;border:1.5px solid var(--ln);background:var(--sf2);flex:none;padding:0;}
.glass.full{background:var(--water);border-color:var(--water);}
.meal{padding:8px 0;border-top:1px solid var(--ln);}
.ingrow{padding:7px 0;border-bottom:1px solid var(--ln);}
.ingline{font-size:14px;line-height:1.5;padding:7px 0;border-bottom:1px solid var(--ln);}
.x{color:var(--mut);font-size:20px;padding:0 4px;line-height:1;}
.stepper{display:flex;align-items:center;border:1px solid var(--ln);border-radius:10px;overflow:hidden;}
.stepper button{padding:8px 12px;font-size:16px;}
.stepper span{padding:0 6px;font-size:13px;min-width:34px;text-align:center;}
.seg{display:flex;border:1px solid var(--ln);border-radius:10px;overflow:hidden;}
.seg button{flex:1;padding:9px 0;font-size:13px;font-weight:600;color:var(--mut);}
.seg button.on{background:var(--sf2);color:var(--ink);}
.steps{margin:0 0 18px;padding:0;list-style:none;}
.steps li{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px;font-size:14.5px;line-height:1.55;}
.stepno{font-size:13px;font-weight:700;color:var(--amber);flex:none;width:22px;height:22px;border-radius:999px;
border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;margin-top:1px;}
.cam-wrap{position:relative;width:100%;aspect-ratio:4/3;background:#000;border:1px solid var(--ln);
border-radius:12px;overflow:hidden;}
.cam-wrap video{width:100%;height:100%;object-fit:cover;display:block;}
.cam-line{position:absolute;left:12%;right:12%;top:50%;height:2px;background:var(--coral);opacity:.85;}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--sf);border-top:1px solid var(--ln);
display:flex;max-width:460px;margin:0 auto;padding-bottom:calc(4px + env(safe-area-inset-bottom));}
#nav button{flex:1;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;
font-size:10px;font-weight:600;color:var(--mut);letter-spacing:.03em;}
#nav button.on{color:var(--amber);}
#nav .pip{width:18px;height:3px;border-radius:2px;background:transparent;}
#nav button.on .pip{background:var(--amber);}
#sheet{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;justify-content:flex-end;background:rgba(10,7,5,.72);}
.sheet-in{background:var(--bg);border-top:1px solid var(--ln);border-radius:18px 18px 0 0;max-height:88vh;
overflow-y:auto;padding:16px 16px calc(28px + env(safe-area-inset-bottom));animation:up .22s ease-out;}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet-in{animation:none}.vessel .fill,.bar>div{transition:none}}
#toast{position:fixed;bottom:calc(88px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
background:var(--sf2);border:1px solid var(--ln);padding:9px 16px;border-radius:999px;font-size:13px;
z-index:80;white-space:nowrap;display:none;}
</style>
</head>
<body>
<div id="app"><div id="main"></div></div>
<nav id="nav">
  <button data-tab="danas" class="on"><span class="pip"></span>Danas</button>
  <button data-tab="recepti"><span class="pip"></span>Recepti</button>
  <button data-tab="namirnice"><span class="pip"></span>Namirnice</button>
  <button data-tab="vise"><span class="pip"></span>Više</button>
</nav>
<div id="sheet"></div>
<div id="toast"></div>
<script src="zxing.js"></script>
<script src="seed.js"></script>
<script src="app.js"></script>
</body>
</html>
